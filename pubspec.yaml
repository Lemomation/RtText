name: rttext
description: RtText - chat with AI characters you create.
publish_to: "none"
version: 0.4.4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_animate: ^4.5.2
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  provider: ^6.1.2
  http: ^1.2.2
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
