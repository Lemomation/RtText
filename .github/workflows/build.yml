name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Gradle wrapper
        # The repo ships wrapper properties but not the wrapper jar; generate
        # it so `flutter build apk` can invoke Gradle.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - run: gradle wrapper --gradle-version 8.14
        working-directory: android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}
          --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rttext-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
