name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Gradle wrapper
        # The repo ships wrapper properties but not the wrapper jar; generate
        # it so `flutter build apk` can invoke Gradle. Version matches the
        # Flutter stable template pin in android/gradle-wrapper.properties.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install dependencies
        run: flutter pub get

      - run: gradle wrapper --gradle-version 9.3.1
        working-directory: android

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Split per ABI: the arm64 APK is roughly half the universal size,
          # and it is what the in-app updater downloads (published under the
          # historical name app-release.apk so older installs keep working).
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co} \
            --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)
          DIR=build/app/outputs/flutter-apk
          # Existing release for this version: refresh its APKs in place so
          # the Releases page always carries the newest main build. A new
          # pubspec version creates a fresh release instead.
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIR/app-release.apk" \
              "$DIR/app-armeabi-v7a-release.apk" --clobber
          else
            gh release create "$TAG" "$DIR/app-release.apk" \
              "$DIR/app-armeabi-v7a-release.apk" \
              --title "RtText $TAG" \
              --notes "Automated CI build of $GITHUB_SHA. app-release.apk is arm64 (modern phones); app-armeabi-v7a-release.apk for old 32-bit devices." \
              --latest
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rttext-release-apk
          path: build/app/outputs/flutter-apk/rttext-arm64.apk
