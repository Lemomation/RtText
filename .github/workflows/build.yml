name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Gradle wrapper
        # The repo ships wrapper properties but not the wrapper jar; generate
        # it so `flutter build apk` can invoke Gradle. Version matches the
        # Flutter stable template pin in android/gradle-wrapper.properties.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install dependencies
        run: flutter pub get

      - run: gradle wrapper --gradle-version 9.3.1
        working-directory: android

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}
          --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Existing release for this version: refresh its APK in place so
          # the Releases page always carries the newest main build. A new
          # pubspec version creates a fresh release instead.
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "RtText $TAG" \
              --notes "Automated CI build of $GITHUB_SHA" \
              --latest
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rttext-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
